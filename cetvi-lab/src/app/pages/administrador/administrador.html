<div class="main__container">
  <div class="container">

    <div class="header-actions">
      <div class="search-box">
        <span class="material-symbols-outlined search-icon">search</span>
        <input type="text" placeholder="Buscar por nombre" class="form-input" [(ngModel)]="filtroNombre" />
      </div>

      <button class="new__customer" (click)="openNewUserModal()">
        Nuevo Usuario
        <span class="material-symbols-outlined">person_add</span>
      </button>
    </div>

    <div class="table-card">
      <table class="table__clientes">
        <thead>
          <tr>
            <th>NOMBRE COMPLETO</th>
            <th>ROLES ASIGNADOS</th>
            <th>ACCIONES</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of usuariosFiltrados">
            <td>{{ user.nombreCompleto }}</td>
            <td>
              <div class="roles-container">
                <span class="role-badge" *ngFor="let rol of user.listaRoles">{{ rol }}</span>
                <span *ngIf="user.listaRoles.length === 0" class="text-muted">Sin roles</span>
              </div>
            </td>
            <td>
              <button class="btn-icon-only" (click)="openRolesModal(user)" title="Gestionar Roles">
                <span class="material-symbols-outlined">settings_accessibility</span>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="showFormModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Nuevo Usuario</h3>
      <span class="material-symbols-outlined close-btn" (click)="closeModals()">close</span>
    </div>
    <div class="modal-body-grid">
      <div class="input-group">
        <label>Nombre:</label>
        <input type="text" [(ngModel)]="usuarioForm.nombre">
      </div>
      <div class="input-group">
        <label>Apellido:</label>
        <input type="text" [(ngModel)]="usuarioForm.apellido">
      </div>
      <div class="input-group">
        <label>Usuario:</label>
        <input type="text" [(ngModel)]="usuarioForm.login">
      </div>
      <div class="input-group">
        <label>Contraseña:</label>
        <input type="password" [(ngModel)]="usuarioForm.password">
      </div>
      <div class="input-group">
        <label>Teléfono:</label>
        <input type="text" maxlength="10" [(ngModel)]="usuarioForm.telefono">
      </div>
      <div class="input-group">
        <label>Cédula:</label>
        <input type="text" maxlength="10" [(ngModel)]="usuarioForm.cedula">
      </div>
    </div>
    <div class="modal-actions">
      <button class="primary" [disabled]="!formularioValido || cargando" (click)="guardarUsuario()">
        {{ cargando ? 'GUARDANDO...' : 'GUARDAR USUARIO' }}
      </button>
      <button class="btn-cancel" (click)="closeModals()">CANCELAR</button>
    </div>
  </div>
</div>
<div class="modal-overlay" *ngIf="showRolesModal">
  <div class="modal-content role-modal-compact">

    <div class="modal-header">
      <div class="header-title">
        <span class="material-symbols-outlined header-icon">shield_person</span>
        <h3>Gestionar Roles</h3>
      </div>
      <span class="material-symbols-outlined close-btn" (click)="closeRolesModal()">close</span>
    </div>

    <div class="user-subtitle">
      {{ usuarioSeleccionado?.nombreCompleto }}
    </div>

    <div class="modal-body-compact">
      <div class="checkbox-list">
        <div class="checkbox-item" *ngFor="let rol of listaRolesDisponibles">
          <label class="custom-checkbox">
            <input type="checkbox" [checked]="rolSeleccionado(rol.id)" (change)="toggleRol(rol.id, $event)">
            <span class="checkmark">
              <span class="material-symbols-outlined check-icon">check</span>
            </span>
            <span class="role-text">{{ rol.nombre }}</span>
          </label>
        </div>
      </div>
    </div>

    <div class="modal-footer-centered">
      <button class="primary-btn" (click)="guardarRoles()">
        <span class="material-symbols-outlined">save</span>
        GUARDAR ROLES
      </button>
      <button class="cancel-link" (click)="closeRolesModal()">CANCELAR</button>
    </div>
  </div>
</div>
