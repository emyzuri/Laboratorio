<div class="login-wrapper">

  <div class="login-container">

    <div class="login-left">

      <h1>Iniciar Sesión</h1>

      <div class="form-group">
        <input
          #u
          type="text"
          placeholder="Usuario"
          (keyup.enter)="login(u.value, p.value)"
        />

        <input
          #p
          type="password"
          placeholder="Contraseña"
          (keyup.enter)="login(u.value, p.value)"
        />
      </div>

      <!-- Botón normal para asegurar funcionamiento -->
      <button
        type="button"
        class="btn-login"
        (click)="login(u.value, p.value)">
        Ingresar
      </button>

    </div>

    <div class="login-right">
      <sgc-logo width="300px"></sgc-logo>
    </div>

  </div>

</div>
