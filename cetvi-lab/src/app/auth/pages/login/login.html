<!-- NUEVO DISE;O -->
<div class="login-wrapper">

  <div class="login-container">

    <!-- LADO IZQUIERDO -->
    <div class="login-left">

      
      <h1>Iniciar Sesión</h1>
      
      <div class="form-group">
        <input #u type="text" placeholder="Usuario" />
        <input #p type="password" placeholder="Contraseña"
        (keyup.enter)="login(u.value, p.value)" />
      </div>

      <sgc-button
      [fullWidth]="true"
      variant="primary"
      (click)="login(u.value, p.value)">
      Ingresar
      </sgc-button>
      
    </div>

    <!-- LADO DERECHO -->
    <div class="login-right">
      <sgc-logo width="300px"></sgc-logo>
    </div>

  </div>

</div>
